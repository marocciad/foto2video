<!doctype html>
<!-- Carosello per i social (HyperFrames): una slide al secondo, resa come sequenza PNG a 1 fps.
     Lo studio sostituisce __W__, __H__, __DUR__ e __CONFIG__. Le grafiche sono nello stato finale
     (niente animazioni: sono immagini). -->
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--__MAPLIBS__-->
    <style>
      @font-face { font-family: "Anton"; src: url("fonts/Anton-Regular.ttf"); }
      @font-face { font-family: "Bebas Neue"; src: url("fonts/BebasNeue-Regular.ttf"); }
      @font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack-Regular.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __W__px; height: __H__px; overflow: hidden; background: #080b10; }
      #root { --green: #22c55e; --gold: #f5b82e; --ink: #f5f5f7; position: relative; width: 100%; height: 100%;
              overflow: hidden; font-family: "Bebas Neue", sans-serif; color: var(--ink); }
      .slide { position: absolute; inset: 0; visibility: hidden; overflow: hidden;
               background: radial-gradient(circle at 50% 38%, #0f2a18 0%, #080b10 62%); }
      .slide .grid { position: absolute; inset: 0; opacity: 0.08;
                     background-image: linear-gradient(#22c55e 1px, transparent 1px),
                                       linear-gradient(90deg, #22c55e 1px, transparent 1px);
                     background-size: calc(var(--u) * 8) calc(var(--u) * 8); }
      .brand { position: absolute; top: calc(var(--u) * 4); left: calc(var(--u) * 5); height: calc(var(--u) * 5); }
      .count { position: absolute; top: calc(var(--u) * 4.4); right: calc(var(--u) * 5); font-size: calc(var(--u) * 4);
               letter-spacing: 0.1em; color: rgba(245, 245, 247, 0.6); }
      .swipe { position: absolute; bottom: calc(var(--u) * 4.5); right: calc(var(--u) * 5); font-size: calc(var(--u) * 4);
               letter-spacing: 0.12em; color: var(--green); }
      .title { position: absolute; left: calc(var(--u) * 6); right: calc(var(--u) * 6); font-family: "Anton", sans-serif;
               line-height: 1.04; text-transform: uppercase; text-shadow: 0 calc(var(--u) * 0.6) calc(var(--u) * 2) rgba(0, 0, 0, 0.8); }
      .title .k { color: var(--green); }
      .title .b { color: var(--gold); }
      .hero { position: absolute; left: 0; right: 0; top: 0; height: 62%; background-size: cover; background-position: center 35%; }
      .hero::after { content: ""; position: absolute; inset: 0;
                     background: linear-gradient(180deg, rgba(8, 11, 16, 0) 45%, #080b10 100%); }
      .card { position: absolute; left: 50%; transform: translateX(-50%); padding: calc(var(--u) * 3) calc(var(--u) * 4);
              background: rgba(8, 11, 16, 0.85); border: 1px solid rgba(34, 197, 94, 0.5); border-radius: calc(var(--u) * 2.2);
              box-shadow: 0 0 calc(var(--u) * 5) rgba(34, 197, 94, 0.25); }
      .kicker { font-size: calc(var(--u) * 4.2); letter-spacing: 0.08em; color: var(--green); margin-bottom: calc(var(--u) * 1); }
      .big { font-family: "Anton", sans-serif; font-size: calc(var(--u) * 15); line-height: 1; text-align: center;
             text-shadow: 0 0 calc(var(--u) * 3) rgba(34, 197, 94, 0.6); }
      .label { font-size: calc(var(--u) * 5); text-align: center; letter-spacing: 0.04em; }
      .track { margin-top: calc(var(--u) * 2); height: calc(var(--u) * 1); border-radius: 99px; background: var(--green); }
      .row { display: flex; align-items: center; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 1.8); }
      .row .name { width: calc(var(--u) * 18); font-size: calc(var(--u) * 4.6); }
      .row .bar { height: calc(var(--u) * 4.4); border-radius: calc(var(--u) * 0.8); }
      .row .val { font-family: "Anton", sans-serif; font-size: calc(var(--u) * 5.2); }
      .dots { display: flex; gap: calc(var(--u) * 2); justify-content: center; margin-top: calc(var(--u) * 1.5); }
      .dot { width: calc(var(--u) * 10); height: calc(var(--u) * 10); border-radius: 50%; display: flex; align-items: center;
             justify-content: center; font-family: "Anton", sans-serif; font-size: calc(var(--u) * 5); }
      .phone { position: absolute; left: 50%; transform: translateX(-50%); background: #0b0f14;
               border: calc(var(--u) * 1) solid #1f2937; border-radius: calc(var(--u) * 7); overflow: hidden;
               box-shadow: 0 0 calc(var(--u) * 6) rgba(34, 197, 94, 0.35); }
      .phone img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .map .country { fill: #1a222d; stroke: #2b3644; stroke-width: 0.6; }
      .map .country.on { fill: #22c55e; stroke: #bbf7d0; stroke-width: 1.2; }
      .map text { font-family: "Bebas Neue", sans-serif; fill: #f5f5f7; paint-order: stroke; stroke: #080b10;
                  stroke-width: 5px; text-anchor: middle; }
      .outro-logo { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); }
      .halo { position: absolute; left: 50%; top: 40%; width: 80%; aspect-ratio: 1; border-radius: 50%;
              transform: translate(-50%, -50%);
              background: radial-gradient(circle, rgba(34, 197, 94, 0.4) 0%, rgba(34, 197, 94, 0) 65%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__"
         data-width="__W__" data-height="__H__">
      <div id="drv" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0"
           style="position:absolute;width:1px;height:1px;opacity:0"></div>
    </div>
    <script>
      (function () {
        var CONFIG = __CONFIG__;
        var W = __W__, H = __H__;
        var root = document.getElementById("root");
        var u = Math.min(W, H) / 100;
        root.style.setProperty("--u", u + "px");
        var EMPH = CONFIG.enfasi || [];
        var tl = gsap.timeline({ paused: true });

        function el(tag, cls, parent, html) {
          var e = document.createElement(tag);
          if (cls) e.className = cls;
          if (html !== undefined) e.innerHTML = html;
          (parent || root).appendChild(e);
          return e;
        }
        function esc(s) { return s.replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
        function styled(text) {   // parole chiave in verde, BetForge in oro
          return text.split(/\s+/).map(function (w) {
            var key = w.toLowerCase().replace(/[.,;:!?…"']/g, "");
            if (key.indexOf("betforge") >= 0) return '<span class="b">' + esc(w) + "</span>";
            return EMPH.indexOf(key) >= 0 ? '<span class="k">' + esc(w) + "</span>" : esc(w);
          }).join(" ");
        }
        function fmt(v, dec) { return dec ? v.toFixed(dec).replace(".", ",") : Math.round(v).toLocaleString("it-IT"); }
        function fitTitle(t, maxSize, maxLines) {   // il titolo si rimpicciolisce finche' ci sta
          var size = maxSize;
          t.style.fontSize = size + "px";
          while (size > u * 5 && t.scrollHeight > size * 1.08 * maxLines) { size -= u * 0.5; t.style.fontSize = size + "px"; }
        }

        var graphics = {
          contatore: function (g, s, top) {
            var c = el("div", "card", s); c.style.top = top + "px"; c.style.minWidth = (W * 0.6) + "px";
            if (g.kicker) el("div", "kicker", c, esc(g.kicker));
            el("div", "big", c, fmt(g.valore, g.decimali) + esc(g.suffisso || ""));
            if (g.etichetta) el("div", "label", c, esc(g.etichetta));
            el("div", "track", c);
          },
          barre: function (g, s, top) {
            var c = el("div", "card", s); c.style.top = top + "px";
            el("div", "kicker", c, esc(g.kicker || ""));
            var max = Math.max.apply(null, g.voci.map(function (v) { return v.valore; }));
            g.voci.forEach(function (v, i) {
              var r = el("div", "row", c);
              el("div", "name", r, esc(v.nome));
              var b = el("div", "bar", r);
              b.style.width = (u * 40 * v.valore / max) + "px";
              b.style.background = i === 0 ? "var(--green)" : "rgba(245,245,247,0.85)";
              el("div", "val", r, fmt(v.valore, g.decimali === undefined ? 2 : g.decimali));
            });
          },
          rating: function (g, s, top) {
            var c = el("div", "card", s); c.style.top = top + "px"; c.style.textAlign = "center";
            el("div", "kicker", c, esc(g.kicker || ""));
            var sz = u * 46, r = sz * 0.4, len = Math.PI * r, y = sz * 0.52;
            var arc = "M " + (sz / 2 - r) + " " + y + " A " + r + " " + r + " 0 0 1 " + (sz / 2 + r) + " " + y;
            el("div", "", c, '<svg width="' + sz + '" height="' + sz * 0.6 + '">' +
              '<path d="' + arc + '" fill="none" stroke="rgba(245,245,247,0.15)" stroke-width="' + u * 3 + '" stroke-linecap="round"/>' +
              '<path d="' + arc + '" fill="none" stroke="#22c55e" stroke-width="' + u * 3 + '" stroke-linecap="round" stroke-dasharray="' +
              len + '" stroke-dashoffset="' + len * (1 - g.valore / 100) + '"/>' +
              '<text x="' + sz / 2 + '" y="' + sz * 0.5 + '" text-anchor="middle" fill="#f5f5f7" font-family="Anton" font-size="' +
              u * 12 + '">' + Math.round(g.valore) + "</text></svg>");
            el("div", "label", c, esc(g.etichetta || ""));
          },
          forma: function (g, s, top) {
            var c = el("div", "card", s); c.style.top = top + "px";
            el("div", "kicker", c, esc(g.kicker || ""));
            var d = el("div", "dots", c), colors = { V: "#22c55e", N: "rgba(245,245,247,0.55)", P: "#ef4444" };
            g.sequenza.split("").forEach(function (k) { var x = el("div", "dot", d, k); x.style.background = colors[k]; });
          },
          app: function (g, s, top) {
            var ph = H * 0.5, p = el("div", "phone", s);
            p.style.width = (ph / 2.17) + "px"; p.style.height = ph + "px"; p.style.top = top + "px";
            el("img", "", p).src = g.schermate[0];
          },
          mappa: function (g, s, top) {
            if (!window.__WORLD || !window.d3 || !window.topojson) return;
            var bw = W * 0.86, bh = H * 0.42, NS = "http://www.w3.org/2000/svg";
            var all = topojson.feature(window.__WORLD, window.__WORLD.objects.countries).features;
            var ids = g.paesi.map(function (p) { return p.id; });
            function mainland(f) {
              if (f.geometry.type !== "MultiPolygon") return f;
              var best = null, area = -1;
              f.geometry.coordinates.forEach(function (poly) {
                var x = { type: "Polygon", coordinates: poly }, a = d3.geoArea(x);
                if (a > area) { area = a; best = x; }
              });
              return { type: "Feature", geometry: best };
            }
            var chosen = all.filter(function (f) { return ids.indexOf(String(f.id).padStart(3, "0")) >= 0; });
            var proj = d3.geoMercator().fitExtent([[bw * 0.1, bh * 0.1], [bw * 0.9, bh * 0.92]],
                                                  { type: "FeatureCollection", features: chosen.map(mainland) });
            var path = d3.geoPath(proj);
            var svg = document.createElementNS(NS, "svg");
            svg.setAttribute("width", bw); svg.setAttribute("height", bh); svg.setAttribute("class", "map");
            svg.style.position = "absolute"; svg.style.left = (W - bw) / 2 + "px"; svg.style.top = top + "px";
            s.appendChild(svg);
            var bg = document.createElementNS(NS, "rect");
            bg.setAttribute("width", bw); bg.setAttribute("height", bh); bg.setAttribute("rx", u * 2.5);
            bg.setAttribute("fill", "rgba(8,11,16,0.86)"); bg.setAttribute("stroke", "rgba(34,197,94,0.5)");
            svg.appendChild(bg);
            all.forEach(function (f) {
              var d = path(f); if (!d) return;
              var p = document.createElementNS(NS, "path");
              p.setAttribute("d", d);
              p.setAttribute("class", ids.indexOf(String(f.id).padStart(3, "0")) >= 0 ? "country on" : "country");
              svg.appendChild(p);
            });
            var count = {};
            g.paesi.forEach(function (p) {
              var f = chosen.filter(function (x) { return String(x.id).padStart(3, "0") === p.id; })[0];
              if (!f) return;
              var n = count[p.id] || 0; count[p.id] = n + 1;
              var xy = proj(d3.geoCentroid(mainland(f)));
              var t = document.createElementNS(NS, "text");
              t.textContent = p.nome; t.setAttribute("x", xy[0]); t.setAttribute("y", xy[1] + n * u * 4.5);
              t.setAttribute("font-size", u * 4.2); svg.appendChild(t);
            });
            if (g.kicker) { var k = el("div", "kicker", s, esc(g.kicker)); k.style.position = "absolute";
              k.style.left = "0"; k.style.right = "0"; k.style.textAlign = "center"; k.style.top = (top - u * 6) + "px"; }
          },
        };

        var slides = CONFIG.slide || [], n = slides.length;
        slides.forEach(function (sd, i) {
          var s = el("div", "slide");
          el("div", "grid", s);
          var last = i === n - 1;
          if (i === 0 && CONFIG.copertina) {          // copertina: il personaggio in alto
            var hero = el("div", "hero", s); hero.style.backgroundImage = "url(" + CONFIG.copertina + ")";
          }
          if (!last && CONFIG.logo) { var b = el("img", "brand", s); b.src = CONFIG.logo; }
          if (n > 1) el("div", "count", s, (i + 1) + "/" + n);
          if (!last) el("div", "swipe", s, "SCORRI →");
          var t = el("div", "title", s, styled(sd.testo));
          if (last) {                                    // chiusura: logo grande, frase sotto
            el("div", "halo", s);
            if (CONFIG.logo) { var lg = el("img", "outro-logo", s); lg.src = CONFIG.logo; lg.style.width = (W * 0.62) + "px"; }
            t.style.top = (H * 0.62) + "px"; t.style.textAlign = "center";
            fitTitle(t, u * 9, 2);
          } else if (i === 0) {
            t.style.top = (H * 0.58) + "px";
            fitTitle(t, u * 13, 3);
          } else if (sd.grafica && graphics[sd.grafica.tipo]) {
            graphics[sd.grafica.tipo](sd.grafica, s, H * 0.14);
            t.style.top = (H * (sd.grafica.tipo === "app" ? 0.68 : 0.64)) + "px";
            fitTitle(t, u * 9, 3);
          } else {
            t.style.top = (H * 0.3) + "px";
            fitTitle(t, u * 13, 5);
          }
          // slide i visibile da i-0.5 a i+0.5: il fotogramma al secondo i la mostra intera
          tl.set(s, { visibility: "visible" }, Math.max(i - 0.5, 0));
          tl.set(s, { visibility: "hidden" }, i + 0.5);
        });
        tl.to({}, { duration: 0.01 }, n - 0.01);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
