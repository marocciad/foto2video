name: foto2video-dispatch

on:
  schedule:
    - cron: "*/10 * * * *"   # riserva: il cron di GitHub e' spesso in ritardo (vedi cron-job.org nel README)
  workflow_dispatch: {}       # avvio manuale dal tab Actions o da un cron esterno via API

concurrency:
  group: foto2video-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: pip install --quiet kaggle requests

      - name: Prepara il notebook (copia worker.py accanto ai metadati)
        run: cp worker/worker.py kaggle/worker.py

      - name: Controlla Telegram e, se serve, accendi la GPU
        id: dispatch
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KERNEL_DIR: kaggle
        run: python dispatcher/dispatch.py

      # --- Studio (regia virtuale su CPU): solo se in coda c'e' un vocale --------------
      - name: Studio · ffmpeg (con rubberband e libass)
        if: steps.dispatch.outputs.action == 'studio' && steps.dispatch.outputs.media == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -hide_banner -filters | grep -E " (rubberband|ass) "

      - name: Studio · dipendenze Python
        if: steps.dispatch.outputs.action == 'studio' && steps.dispatch.outputs.media == '1'
        run: pip install --quiet numpy pillow faster-whisper

      - name: Studio · cache del modello whisper
        if: steps.dispatch.outputs.action == 'studio' && steps.dispatch.outputs.media == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Studio · voce sintetica (kokoro, solo per #voce)
        if: steps.dispatch.outputs.action == 'studio' && steps.dispatch.outputs.tts == '1'
        run: |
          sudo apt-get install -y -qq espeak-ng > /dev/null
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet kokoro soundfile

      - name: Studio · cache del modello della voce sintetica
        if: steps.dispatch.outputs.action == 'studio' && steps.dispatch.outputs.tts == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--hexgrad--Kokoro-82M
          key: kokoro-82m-v1

      - name: Studio · modello per i copioni (solo per #idea)
        if: steps.dispatch.outputs.action == 'studio' && steps.dispatch.outputs.llm == '1'
        run: pip install --quiet --only-binary=:all: llama-cpp-python huggingface_hub

      - name: Studio · cache del modello per i copioni
        if: steps.dispatch.outputs.action == 'studio' && steps.dispatch.outputs.llm == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--unsloth--Qwen3-4B-Instruct-2507-GGUF
          key: qwen3-4b-instruct-2507-q4km-v1

      - name: Studio · asset privati (dataset Kaggle)
        if: steps.dispatch.outputs.action == 'studio' && steps.dispatch.outputs.media == '1'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [[ "$KAGGLE_KEY" == KGAT_* ]]; then export KAGGLE_API_TOKEN="$KAGGLE_KEY"; unset KAGGLE_KEY; fi
          kaggle datasets download -d "$KAGGLE_USERNAME/foto2video-assets" -p assets_dl --unzip
          python setup/unpack_assets.py assets_dl assets

      - name: Studio · monta i video
        if: steps.dispatch.outputs.action == 'studio'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          ASSETS_DIR: assets
          WHISPER_MODEL: small
        run: python -m studio
